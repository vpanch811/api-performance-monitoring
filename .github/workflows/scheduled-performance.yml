name: Scheduled Performance Monitoring

on:
  schedule:
    - cron: "30 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  performance-test:
    name: Run Scheduled Performance Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run automated tests
        run: python -m pytest -v

      - name: Start FastAPI server
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/; then
              echo "API is ready"
              exit 0
            fi
            sleep 2
          done
          cat server.log
          exit 1

      - name: Run performance tests
        run: python scripts/run_load_tests.py